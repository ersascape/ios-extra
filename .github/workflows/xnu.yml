name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG / board profile
        type: choice
        required: true
        default: FP6
        options:
          - SWEET
          - PHOENIX
          - FP6
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - "xnu/helpers/**"
      - "shim/**"
      - "tools/mkadt.py"
      - "tools/mkpayload.py"
      - "tools/fp6-package.py"
      - "tools/sweet-init.S"
      - "tools/mkinit.py"
      - "tools/prepare-xnu-build.py"
      - "tools/fp6-gmu-fw.py"
      - "tools/mkbootv4.py"
      - "tools/unpack_bootv2.py"
      - "docs/FAIRPHONE6.md"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}-${{ inputs.machine_config || vars.MACHINE_CONFIG || 'FP6' }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || vars.MACHINE_CONFIG || 'FP6' }}

jobs:
  build:
    # This playground starts private. Build only after it is made public.
    if: ${{ github.event.repository.private == false }}
    # macos-14 still ships Xcode 15.x: its iig matches the xnu-8796 IORPC ABI
    # (Xcode 16's iig emits IORPC.kernelContent, which this xnu lacks)
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Generate Fairphone 6 ADT
        if: ${{ env.MACHINE_CONFIG == 'FP6' }}
        run: |
          mkdir -p out
          python3 tools/mkadt.py out/fp6.adt --device fp6
          shasum -a 256 out/fp6.adt > out/fp6.adt.sha256

      - uses: actions/upload-artifact@v4
        if: ${{ env.MACHINE_CONFIG == 'FP6' && success() }}
        with:
          name: fp6-adt
          path: |
            out/fp6.adt
            out/fp6.adt.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          test "$MACOS_VERSION" = 13.5
          python3 tools/prepare-xnu-build.py dxb
          echo "Building $MACHINE_CONFIG / $KERNEL_CONFIG at $GITHUB_SHA"

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: bash build.sh

      - name: Package build tree for local compiles
        if: always()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn

  fp6-boot:
    needs: build
    if: ${{ (inputs.machine_config || vars.MACHINE_CONFIG || 'FP6') == 'FP6' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xnu-kernel
          path: ci-kernel
      - uses: actions/download-artifact@v4
        with:
          name: fp6-adt
          path: ci-adt
      - name: Install shim toolchain
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm
      - name: Build minimal FP6 RAM-disk init
        run: |
          mkdir -p fp6-boot
          clang -target arm64-apple-ios16.0 -c tools/sweet-init.S -o fp6-boot/init.o
          python3 tools/mkinit.py fp6-boot/init.o fp6-boot/init
      - name: Package FP6 temporary boot image
        if: ${{ vars.FP6_STOCK_DTB_URL != '' }}
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          CI_RUN: ${{ github.run_id }}
          FP6_STOCK_DTB_URL: ${{ vars.FP6_STOCK_DTB_URL }}
        run: |
          kernel="ci-kernel/kernel.$(printf '%s' "$KERNEL_CONFIG" | tr '[:upper:]' '[:lower:]').fp6"
          test -f "$kernel"
          curl --fail --location --retry 3 "$FP6_STOCK_DTB_URL" -o fp6-boot/fp6-stock.dtb
          test -s fp6-boot/fp6-stock.dtb
          python3 tools/fp6-package.py --kernel "$kernel" --adt ci-adt/fp6.adt \
            --dtb fp6-boot/fp6-stock.dtb --ramdisk fp6-boot/init \
            --out fp6-boot --commit "$SOURCE_COMMIT" --ci-run "$CI_RUN"
          python3 tools/fp6-package.py --kernel "$kernel" --adt ci-adt/fp6.adt \
            --dtb fp6-boot/fp6-stock.dtb --ramdisk fp6-boot/init \
            --ufs-probe --out fp6-boot/ufs-probe \
            --image-name fp6-shim-ufs-probe.img --commit "$SOURCE_COMMIT" --ci-run "$CI_RUN"
          python3 tools/fp6-package.py --kernel "$kernel" --adt ci-adt/fp6.adt \
            --dtb fp6-boot/fp6-stock.dtb --ufs-root --out fp6-boot/ufs-root \
            --image-name fp6-shim-ufs-root.img --commit "$SOURCE_COMMIT" --ci-run "$CI_RUN"
          python3 tools/fp6-package.py --kernel "$kernel" --adt ci-adt/fp6.adt \
            --dtb fp6-boot/fp6-stock.dtb --ramdisk fp6-boot/init \
            --cmdline 'debug=0xc serial=3 cpus=8 keepsyms=1 -noprogress rd=md0 fp6usb=2' \
            --out fp6-boot/usb-debug --image-name fp6-shim-usb-debug.img \
            --commit "$SOURCE_COMMIT" --ci-run "$CI_RUN"
      - uses: actions/upload-artifact@v4
        if: ${{ vars.FP6_STOCK_DTB_URL != '' }}
        with:
          name: fp6-fastboot-boot
          path: |
            fp6-boot/fp6-shim-boot.img
            fp6-boot/SHA256SUMS
            fp6-boot/manifest.json
            fp6-boot/ufs-probe/fp6-shim-ufs-probe.img
            fp6-boot/ufs-probe/SHA256SUMS
            fp6-boot/ufs-probe/manifest.json
            fp6-boot/ufs-root/fp6-shim-ufs-root.img
            fp6-boot/ufs-root/SHA256SUMS
            fp6-boot/ufs-root/manifest.json
            fp6-boot/usb-debug/fp6-shim-usb-debug.img
            fp6-boot/usb-debug/SHA256SUMS
            fp6-boot/usb-debug/manifest.json
          if-no-files-found: error
          retention-days: 7
      - name: Explain missing FP6 stock DTB
        if: ${{ vars.FP6_STOCK_DTB_URL == '' }}
        run: |
          echo "::warning::Skipped fastboot image: set the repository variable FP6_STOCK_DTB_URL to a direct URL for the matching stock FP6 DTB."
